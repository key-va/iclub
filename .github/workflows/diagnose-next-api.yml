name: Inspect next API package
on:
  push:
    branches: [next]
    paths: ['.github/workflows/diagnose-next-api.yml']
permissions:
  id-token: write
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'Check remaining next API files'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/checkout@v4
      - name: Compare deployed function files with source
        run: |
          token=$(timeout 20 az account get-access-token --query accessToken -o tsv)
          echo "::add-mask::$token"
          root=https://nextxfa.scm.azurewebsites.net/api/vfs/site/wwwroot/dist/src/functions
          git ls-files 'api/src/functions/*.ts' | sed 's@.*/@@; s/\.ts$/.js/' | sort > /tmp/iclub-expected
          curl --retry 2 --max-time 10 -fsS -H "Authorization: Bearer $token" "$root/" |
            jq -r '.[].name | select(endswith(".js"))' | sort > /tmp/iclub-deployed
          echo 'Extra compiled files:'
          comm -13 /tmp/iclub-expected /tmp/iclub-deployed
          echo 'Missing compiled files:'
          comm -23 /tmp/iclub-expected /tmp/iclub-deployed
      - name: Synchronise Function App triggers
        if: always()
        run: |
          app_id=$(az functionapp show -g next -n nextxfa --query id -o tsv)
          timeout 45 az rest --method post --url "https://management.azure.com$app_id/syncfunctiontriggers?api-version=2024-11-01"
